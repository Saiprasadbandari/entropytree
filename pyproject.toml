[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-entropytree"
version = "0.2.0"
description = "A decision tree classifier from scratch using entropy and information gain"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
